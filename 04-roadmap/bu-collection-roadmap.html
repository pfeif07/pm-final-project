<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BU Collection roadmap</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #14233b; --muted: #57657d; --line: #d3dbe5;
    --qw-bg: #dff3e6; --qw-fg: #17613a;
    --mp-bg: #dce9fb; --mp-fg: #174a8a;
    --fi-bg: #ece9f6; --fi-fg: #4a3a8a;
    --ts-bg: #fbe3dc; --ts-fg: #8a2f17;
    --accent: #0e6f6e; --focus: #0e6f6e;
    --serif: Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1826; --card: #172236; --ink: #e8eef6; --muted: #a7b4c8; --line: #2b3a52;
      --qw-bg: #12392a; --qw-fg: #8fe0b2;
      --mp-bg: #14305a; --mp-fg: #a9cbf6;
      --fi-bg: #2a2550; --fi-fg: #c5bbf0;
      --ts-bg: #4a2318; --ts-fg: #f4b4a2;
      --accent: #5fd0cb; --focus: #5fd0cb;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; padding: 28px clamp(16px, 4vw, 48px) 48px; }
  main { max-width: 1280px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; align-items: end; margin-bottom: 18px; }
  .brand { color: var(--accent); font-weight: 700; font-size: 13px; margin: 0 0 4px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(26px, 3.6vw, 36px); margin: 0; line-height: 1.1; }
  .meta { color: var(--muted); font-size: 13px; text-align: right; }
  .meta b { color: var(--ink); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  .toolbar span { color: var(--muted); font-size: 13px; margin-right: 4px; }
  .chip { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip:focus-visible, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .lane { background: color-mix(in srgb, var(--card) 55%, var(--bg)); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-height: 120px; }
  .lane h2 { margin: 0 0 2px; font-family: var(--serif); font-weight: 400; font-size: 22px; }
  .lane .sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .lane .count { color: var(--muted); font-size: 12px; margin-left: 6px; }

  .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 0 10px; cursor: pointer; }
  .card:hover { border-color: var(--muted); }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .id { color: var(--muted); font-size: 12px; font-weight: 700; }
  .name { font-weight: 700; margin: 2px 0 6px; }
  .why { margin: 0; color: var(--muted); }
  .badge { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .qw { background: var(--qw-bg); color: var(--qw-fg); }
  .mp { background: var(--mp-bg); color: var(--mp-fg); }
  .fi { background: var(--fi-bg); color: var(--fi-fg); }
  .ts { background: var(--ts-bg); color: var(--ts-fg); }
  .detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .card[aria-expanded="true"] .detail { display: block; }
  .scores { display: flex; gap: 20px; }
  .scores div { flex: 1; }
  .scores b { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .pips { display: flex; gap: 3px; }
  .pip { width: 100%; height: 6px; border-radius: 3px; background: var(--line); }
  .pip.on { background: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; margin: 0; }

  .cut { margin-top: 28px; }
  .cut h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
  .cut .sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .cut-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cut .card { cursor: default; margin: 0; border-style: dashed; }
  .cut .name { text-decoration: line-through; text-decoration-thickness: 1px; }
  .hidden { display: none !important; }

  @media (max-width: 900px) { .lanes, .cut-grid { grid-template-columns: 1fr; } .meta { text-align: left; } }
  @media print { body { background: #fff; padding: 0; } .toolbar { display: none; } .detail { display: block !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="brand">BU Collection</p>
      <h1>Multi-claim self-service roadmap</h1>
    </div>
    <div class="meta">
      <div><b>Team:</b> 1 squad of 6 (assumed)</div>
      <div><b>Primary metric:</b> +10% multi-claim conversion</div>
      <div><b>Guardrail:</b> call-in rate must not increase</div>
    </div>
  </header>

  <div class="toolbar" role="group" aria-label="Filter by quadrant">
    <span>Filter</span>
    <button class="chip" data-q="all" aria-pressed="true">All</button>
    <button class="chip" data-q="Quick Win" aria-pressed="false">Quick Win</button>
    <button class="chip" data-q="Major Project" aria-pressed="false">Major Project</button>
    <button class="chip" data-q="Fill-In" aria-pressed="false">Fill-In</button>
    <button class="chip" data-q="Time Sinker" aria-pressed="false">Time Sinker</button>
  </div>

  <section class="lanes" aria-label="Roadmap lanes">
    <div class="lane" id="lane-now"><h2>NOW<span class="count"></span></h2><p class="sub">This sprint</p><div class="items"></div></div>
    <div class="lane" id="lane-next"><h2>NEXT<span class="count"></span></h2><p class="sub">The following sprints</p><div class="items"></div></div>
    <div class="lane" id="lane-later"><h2>LATER<span class="count"></span></h2><p class="sub">Backlog</p><div class="items"></div></div>
  </section>

  <section class="cut" aria-label="Cut list">
    <h2>Cut list</h2>
    <p class="sub">Not planned in this window</p>
    <div class="cut-grid" id="cut"></div>
  </section>
</main>

<script>
  var QUAD = {
    "Quick Win": "qw",
    "Major Project": "mp",
    "Fill-In": "fi",
    "Time Sinker": "ts"
  };

  var FEATURES = [
    { id: "B1", lane: "now", name: "One plan for several open claims", q: "Major Project", v: 5, e: 4,
      why: "This is the moment of misery itself. Without it, the +10% multi-claim conversion goal has no mechanism." },
    { id: "B2", lane: "next", name: "Plain explainer for why income is asked and how it is used", q: "Quick Win", v: 3, e: 1,
      why: "It removes the \u201cwhat if they use it against me\u201d drop-off (N-06, T-206) and reduces calls. Copy and design only." },
    { id: "B3", lane: "now", name: "Affordability check before the plan options", q: "Major Project", v: 4, e: 3,
      why: "B1 is only useful if the plan is affordable. It also prevents missed second payments (N-02), which protects the call-in guardrail." },
    { id: "B4", lane: "later", name: "Handoff summary for the agent when a consumer calls", q: "Fill-In", v: 2, e: 2,
      why: "It helps agents once she calls, but does nothing for conversion or call-in rate. This is an Ops preference." },
    { id: "B5", lane: "next", name: "Photo upload that works on mobile, or skip the document under a set amount", q: "Major Project", v: 4, e: 3,
      why: "T-201 shows 853 journeys stalled on a document that never arrived. Split it, as noted below." },
    { id: "B6", lane: "later", name: "Pick a payment date that matches pay day", q: "Major Project", v: 3, e: 3,
      why: "It helps variable shift income stay on plan, but it follows B1 and B3 and isn\u2019t the core friction." },
    { id: "B7", lane: "cut", name: "Show the shortest plan first to raise recovery", q: "Fill-In", v: 1, e: 1,
      why: "It steers her to the plan she is most likely to miss (N-02), which pushes calls up. It serves recovery targets, not the persona." },
    { id: "B8", lane: "cut", name: "Chat assistant on every portal page", q: "Time Sinker", v: 2, e: 5,
      why: "It is large and compliance-heavy in a collections context. It risks becoming a second route to the agent, and it doesn\u2019t fix the multi-claim flow." }
  ];

  var filter = "all";

  function pips(n) {
    var out = "";
    for (var i = 1; i <= 5; i++) out += '<span class="pip' + (i <= n ? " on" : "") + '"></span>';
    return '<div class="pips" aria-hidden="true">' + out + "</div>";
  }

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function cardFor(f, interactive) {
    var c = el(interactive ? "button" : "div", "card");
    if (interactive) { c.type = "button"; c.setAttribute("aria-expanded", "false"); }
    c.dataset.q = f.q;
    c.innerHTML =
      '<div class="card-top"><div><span class="id">' + esc(f.id) + '</span><div class="name">' + esc(f.name) + '</div></div>' +
      '<span class="badge ' + QUAD[f.q] + '">' + esc(f.q) + '</span></div>' +
      '<p class="why">' + esc(f.why) + '</p>' +
      (interactive
        ? '<div class="detail"><div class="scores">' +
          '<div><b>Value ' + f.v + ' of 5</b>' + pips(f.v) + '</div>' +
          '<div><b>Effort ' + f.e + ' of 5</b>' + pips(f.e) + '</div></div></div>'
        : "");
    if (interactive) {
      c.addEventListener("click", function () {
        c.setAttribute("aria-expanded", c.getAttribute("aria-expanded") === "true" ? "false" : "true");
      });
    }
    return c;
  }

  function render() {
    ["now", "next", "later"].forEach(function (lane) {
      var box = document.querySelector("#lane-" + lane + " .items");
      var count = document.querySelector("#lane-" + lane + " .count");
      box.innerHTML = "";
      var all = FEATURES.filter(function (f) { return f.lane === lane; });
      var shown = all.filter(function (f) { return filter === "all" || f.q === filter; });
      shown.forEach(function (f) { box.appendChild(cardFor(f, true)); });
      count.textContent = "(" + shown.length + ")";
      if (!shown.length) {
        var msg = all.length ? "No items in this quadrant." : "Nothing planned yet. Capacity is held for the Now lane.";
        box.appendChild(el("p", "empty", msg));
      }
    });
    var cut = document.getElementById("cut");
    cut.innerHTML = "";
    FEATURES.filter(function (f) { return f.lane === "cut"; }).forEach(function (f) {
      var c = cardFor(f, false);
      if (filter !== "all" && f.q !== filter) c.classList.add("hidden");
      cut.appendChild(c);
    });
  }

  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.q;
      document.querySelectorAll(".chip").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      render();
    });
  });

  render();
</script>
</body>
</html>
