<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One plan for your open claims</title>
<style>
/* Riverty look: Haze page, Vanguard accent, Charcoal text (styleguide pp. 21-24, 69).
   GT Ultra is a licensed font and is not embedded here, so a serif/sans fallback stack stands in. */
:root{
  --ink:#282828;        /* Charcoal */
  --muted:#686868;      /* 70% Charcoal */
  --paper:#E7E4E2;      /* Haze */
  --card:#FFFFFF;
  --line:#C9C9C9;      /* 25% Charcoal */
  --accent:#527A42;     /* Vanguard */
  --accent-ink:#FFFFFF;
  --accent-soft:#CBD7C6;/* 30% Vanguard */
  --ember:#EF706B;      /* Ember */
  --ember-soft:#F9C6C4; /* 40% Ember */
  --off:#F3F1F0;        /* 50% Haze */
  --head:"GT Ultra Median","GT Ultra",Georgia,"Times New Roman",serif;
  --body:"GT Ultra Standard","GT Ultra","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 28px}
h1{font:400 2rem/1.15 var(--head);margin:0 0 6px;letter-spacing:-.01em}
.bu{font-size:.85rem;margin:0 0 4px}
.reason{margin:0 0 14px;font-size:.95rem}
.num{font-variant-numeric:tabular-nums}
.claim{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border-left:6px solid var(--accent);padding:10px 12px;margin-bottom:8px}
.claim .name{font-weight:600}
.tag{display:inline-block;font-size:.78rem;background:var(--accent-soft);color:var(--ink);padding:1px 8px;margin-top:3px}
.claim .amt{font:400 1.25rem var(--head);white-space:nowrap}
.claim.off{background:var(--off);border-left-color:var(--muted)}
.claim.off .amt{color:var(--ink)}
.claim.off .why{font-size:.85rem}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px;margin:4px 0 14px;
  border-top:2px solid var(--ink);font:400 1.35rem var(--head)}
label.q{display:block;font:400 1.2rem/1.3 var(--head);margin-bottom:3px}
.why-ask{font-size:.85rem;margin:0 0 8px}
.field{display:flex;align-items:center;background:var(--card);border:1px solid var(--muted)}
.field:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.field.bad{border:2px solid var(--ember)}
.field span{padding:0 4px 0 14px;font-size:1.2rem}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.25rem;padding:13px 12px 13px 4px;outline:none}
.err{font-size:.9rem;margin:6px 0 0;min-height:1.3em}
.field.bad + .err{background:var(--ember-soft);padding:4px 8px}
.btn{display:block;width:100%;min-height:54px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;font-size:1.05rem;margin-top:12px}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn:focus-visible,.link:focus-visible,summary:focus-visible,select:focus-visible,.tbl-wrap:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.alt{background:var(--ink);color:var(--paper)}
.link{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;min-height:44px;padding:0;cursor:pointer;margin-bottom:2px}
.summary{background:var(--card);padding:14px 14px 12px;margin-bottom:10px}
.summary .big{font:300 2.6rem/1.1 var(--head);color:var(--accent)}
.summary .big span{font:400 1rem var(--body);color:var(--ink)}
.summary .row{display:flex;justify-content:space-between;font-size:.95rem;margin-top:4px}
.covers{font-size:.92rem;margin:0 0 10px}
.tbl-wrap{max-height:232px;overflow-y:auto;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:7px 12px;text-align:left}
th{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--ink);font-weight:600}
td.r,th.r{text-align:right}
tbody tr+tr td{border-top:1px solid var(--line)}
tfoot td{border-top:2px solid var(--ink);font-weight:700;position:sticky;bottom:0;background:var(--card)}
.missed{background:var(--ember-soft);border-left:6px solid var(--ember);padding:10px 12px;margin:12px 0 0;font-size:.93rem}
.missed b{display:block;margin-bottom:2px}
.state{background:var(--card);padding:14px;margin:6px 0 4px}
.state h2{font:400 1.3rem/1.25 var(--head);margin:0 0 6px}
.state p{margin:0 0 6px}
.state.bad{border-left:6px solid var(--ember)}
.done h1{color:var(--accent)}
details{background:var(--card);margin:12px 0}
summary{cursor:pointer;min-height:48px;padding:13px 12px;font-weight:600}
details .tbl-wrap{border-top:1px solid var(--line)}
.demo{margin-top:24px;padding-top:10px;border-top:1px dashed var(--muted);font-size:.8rem}
.demo select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--muted);padding:6px;min-height:36px}
[hidden]{display:none!important}
.brandbar{background:var(--accent);padding:14px 16px;display:flex;justify-content:center}
.brandbar img{display:block;height:34px;width:auto;max-width:100%}
</style>
</head>

<div class="wrap">

<!-- SCREEN 1 -->
<section id="s1" aria-labelledby="h1a">
  <p class="bu" id="buName"></p>
  <h1 id="h1a">Your open claims</h1>
  <p class="reason" id="reason1"></p>
  <div id="claims"></div>
  <div id="noneState" class="state bad" hidden>
    <h2>No claims can be combined</h2>
    <p>We can't build a plan right now. Each claim is listed above with its reason.</p>
  </div>
  <div id="totalRow" class="total"><span id="totalLabel">Total</span><span class="num" id="totalAmt"></span></div>
  <div id="askBlock">
    <label class="q" for="amount">What can you comfortably pay in a normal month?</label>
    <p class="why-ask">We ask so we only show plans you can afford.</p>
    <div class="field" id="field"><span aria-hidden="true">€</span>
      <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-describedby="amtErr">
    </div>
    <p class="err" id="amtErr" role="alert"></p>
    <button class="btn" id="seePlan" disabled>See my plan</button>
  </div>
</section>

<!-- SCREEN 2 -->
<section id="s2" hidden aria-labelledby="h2a">
  <button class="link" id="back2">Back</button>
  <h1 id="h2a">Your plan</h1>
  <div id="planBody"></div>
</section>

<!-- SCREEN 3 -->
<section id="s3" hidden class="done" aria-labelledby="h3a">
  <h1 id="h3a" tabindex="-1">Your plan is agreed</h1>
  <div id="doneBody"></div>
</section>

<div class="demo">
  Prototype scenario (mock data):
  <select id="scenario" aria-label="Mock data scenario">
    <option value="two">Two combinable claims</option>
    <option value="one">One combinable claim</option>
    <option value="none">No combinable claims</option>
  </select>
</div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- Fixed mock data and strings ---------- */
  var BU_NAME = "Riverty Collection";
  var FIRST_PAYMENT = {y:2026, m:11, d:1}; // 1 Dec 2026 (month index 11)
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var MISSED_TEXT = "Placeholder, pending Legal approval: If you miss a payment, your plan may stop and the unpaid balance may become due. If you think you may miss a payment, contact us before the payment date.";

  var SCENARIOS = {
    two: [
      {id:"a", creditor:"Invoice I1237854678",  cents:41260, status:"open"},
      {id:"b", creditor:"Invoice I1237856589",      cents:18635, status:"open"},
      {id:"c", creditor:"Subscription SUB9872347",     cents:9500,  status:"dispute"}
    ],
    one: [
      {id:"a", creditor:"Invoice I1237854678",  cents:41260, status:"open"},
      {id:"c", creditor:"Subscription SUB9872347",     cents:9500,  status:"dispute"}
    ],
    none: [
      {id:"c", creditor:"Subscription SUB9872347",     cents:9500,  status:"dispute"},
      {id:"d", creditor:"Health Plus",       cents:27040, status:"inplan"}
    ]
  };
  var REASONS = {
    dispute: "In dispute, so it can't be added to a plan.",
    inplan:  "Already part of another plan.",
    closed:  "No longer open."
  };

  /* ---------- State (memory only) ---------- */
  var state = {
    scenario:"two",
    claims:[], included:[], excluded:[], total:0,
    amountText:"", amountCents:null,
    plan:null, snapshotTotal:null, touched:false
  };

  var $ = function(id){ return document.getElementById(id); };
  var fmtEUR = new Intl.NumberFormat("en-GB",{style:"currency",currency:"EUR"});
  function eur(c){ return fmtEUR.format(c/100); }
  function fmtDate(i){
    var d = new Date(Date.UTC(FIRST_PAYMENT.y, FIRST_PAYMENT.m + i, FIRST_PAYMENT.d));
    return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear();
  }
  function show(id){
    ["s1","s2","s3"].forEach(function(s){ $(s).hidden = (s!==id); });
    window.scrollTo(0,0);
  }

  /* ---------- Eligibility ---------- */
  function loadScenario(key){
    state.scenario = key;
    state.claims = SCENARIOS[key].map(function(c){ return {id:c.id,creditor:c.creditor,cents:c.cents,status:c.status}; });
    state.included = state.claims.filter(function(c){ return c.status==="open"; });   // open, not in dispute, not in a plan
    state.excluded = state.claims.filter(function(c){ return c.status!=="open"; });
    state.total = state.included.reduce(function(s,c){ return s+c.cents; },0);        // exact integer-cent sum
    state.plan = null;
  }

  /* ---------- Plan maths (integer cents) ---------- */
  function buildPlan(total, maxCents){
    for(var n=2;n<=12;n++){
      var base = Math.floor(total/n);
      var last = total - base*(n-1);          // remainder goes into the last instalment
      if(base<=maxCents && last<=maxCents){
        var rows=[], sum=0;
        for(var i=0;i<n;i++){
          var amt = (i===n-1)? last : base;
          rows.push({date:fmtDate(i), cents:amt});
          sum += amt;
        }
        return {n:n, base:base, last:last, rows:rows, sum:sum, total:total, end:rows[n-1].date};
      }
    }
    return null; // needs more than 12 payments
  }

  function parseAmount(txt){
    var t = String(txt).replace(/[€\s]/g,"");
    if(!/^\d+([.,]\d{1,2})?$/.test(t)) return null;
    var c = Math.round(parseFloat(t.replace(",","."))*100);
    return c>0 ? c : null;
  }

  /* ---------- Screen 1 ---------- */
  function renderS1(){
    var one = state.included.length===1;
    $("buName").textContent = BU_NAME;
    $("reason1").textContent = state.included.length
      ? (one ? "We can put this claim into one plan." : "We can put these claims into one plan, so you only agree once.")
      : "We looked at your open claims.";
    var html = "";
    state.included.forEach(function(c){
      html += '<div class="claim"><div><div class="name">'+c.creditor+'</div><span class="tag">Included</span></div>'+
              '<div class="amt num">'+eur(c.cents)+'</div></div>';
    });
    state.excluded.forEach(function(c){
      html += '<div class="claim off"><div><div class="name">'+c.creditor+'</div>'+
              '<div class="why">Not included: '+REASONS[c.status]+'</div></div>'+
              '<div class="amt num">'+eur(c.cents)+'</div></div>';
    });
    $("claims").innerHTML = html;
    var any = state.included.length>0;
    $("noneState").hidden = any;
    $("totalRow").hidden = !any;
    $("askBlock").hidden = !any;
    $("totalLabel").textContent = one ? "Total" : "Total of "+state.included.length+" claims";
    $("totalAmt").textContent = eur(state.total);
    validateInput(false);
  }

  function validateInput(showErr){
    var raw = $("amount").value;
    var c = parseAmount(raw);
    state.amountText = raw; state.amountCents = c;
    var bad = (c===null);
    $("seePlan").disabled = bad;
    var showIt = bad && (showErr || state.touched);
    $("amtErr").textContent = showIt ? "Enter an amount per month" : "";
    $("field").classList.toggle("bad", showIt);
    $("amount").setAttribute("aria-invalid", showIt ? "true":"false");
  }

  /* ---------- Screen 2 ---------- */
  function missedBlock(){
    return '<div class="missed"><b>If you miss a payment</b>'+MISSED_TEXT+'</div>';
  }
  function tableHTML(plan){
    var h = '<div class="tbl-wrap" tabindex="0" aria-label="Payment schedule"><table><thead><tr><th>Date</th><th class="r">Amount</th></tr></thead><tbody>';
    plan.rows.forEach(function(r){ h += '<tr><td>'+r.date+'</td><td class="r num">'+eur(r.cents)+'</td></tr>'; });
    h += '</tbody><tfoot><tr><td>Total</td><td class="r num">'+eur(plan.total)+'</td></tr></tfoot></table></div>';
    return h;
  }
  function coversText(){
    return state.included.map(function(c){ return c.creditor; }).join(" and ");
  }

  function renderS2(){
    var body = $("planBody");
    var plan = buildPlan(state.total, state.amountCents);

    if(!plan){
      state.plan = null;
      body.innerHTML =
        '<div class="state bad"><h2>No plan fits '+eur(state.amountCents)+' a month</h2>'+
        '<p>Your total is '+eur(state.total)+'. A plan can have up to 12 payments, so a monthly amount of at least '+
        eur(Math.ceil(state.total/12))+' is needed.</p>'+
        '<p>Try a higher amount to see a plan.</p></div>'+
        '<button class="btn" id="raise">Change my amount</button>';
      $("raise").onclick = function(){ goS1(true); };
      return;
    }

    // Safety guard: schedule must equal total to the cent, and never exceed the amount entered.
    var maxInst = Math.max(plan.base, plan.last);
    if(plan.sum!==plan.total || plan.total!==state.total || maxInst>state.amountCents){
      state.plan = null;
      body.innerHTML = '<div class="state bad"><h2>We can\u2019t show this plan</h2><p>The numbers didn\u2019t add up, so we\u2019ve stopped. Go back and try again.</p></div>';
      return;
    }
    state.plan = plan;
    state.snapshotTotal = state.total;

    var same = (plan.base===plan.last);
    var inst = same ? eur(plan.base) : eur(plan.base)+' (last: '+eur(plan.last)+')';
    var many = state.included.length>1;
    body.innerHTML =
      '<div class="summary"><div class="big num">'+eur(plan.base)+' <span style="font-size:.9rem;font-weight:600">a month</span></div>'+
      '<div class="row"><span>Payments</span><span class="num">'+plan.n+'</span></div>'+
      '<div class="row"><span>Last payment</span><span class="num">'+plan.end+'</span></div>'+
      '<div class="row"><span>Total</span><span class="num">'+eur(plan.total)+'</span></div></div>'+
      '<p class="covers"><b>Covers:</b> '+coversText()+(many?'':' (1 claim)')+'</p>'+
      tableHTML(plan)+
      missedBlock()+
      '<button class="btn" id="agree">Agree to this plan</button>';
    $("agree").onclick = agree;
  }

  /* ---------- Screen 3 ---------- */
  function agree(){
    // Mid-journey change guard: never show stale numbers.
    var current = SCENARIOS[state.scenario].filter(function(c){ return c.status==="open"; })
      .reduce(function(s,c){ return s+c.cents; },0);
    if(!state.plan || current!==state.snapshotTotal){
      $("planBody").innerHTML = '<div class="state bad"><h2>Your claims have changed</h2><p>Please start again to see the latest amounts.</p></div><button class="btn" id="restart">Start again</button>';
      $("restart").onclick = function(){ loadScenario(state.scenario); goS1(false); };
      return;
    }
    var p = state.plan;
    var h = '<div class="summary"><div class="big num">'+eur(p.base)+' <span style="font-size:.9rem;font-weight:600">a month</span></div>'+
      '<div class="row"><span>Payments</span><span class="num">'+p.n+'</span></div>'+
      '<div class="row"><span>Last payment</span><span class="num">'+p.end+'</span></div></div>'+
      '<p class="covers"><b>Covers:</b> '+coversText()+'</p>';
    if(state.excluded.length){
      h += '<p class="covers"><b>Not included:</b> '+
        state.excluded.map(function(c){ return c.creditor+' ('+REASONS[c.status].replace(/\.$/,"")+')'; }).join("; ")+'.</p>';
    }
    h += '<details><summary>View schedule again</summary>'+tableHTML(p)+'</details>'+
         missedBlock()+
         '<button class="btn alt" id="close">Close</button>';
    $("doneBody").innerHTML = h;
    show("s3");
    $("h3a").focus();
    $("close").onclick = function(){
      $("amount").value=""; state.touched=false; state.plan=null;
      loadScenario(state.scenario); renderS1(); show("s1");
    };
  }

  /* ---------- Navigation ---------- */
  function goS1(focus){
    show("s1");
    if(focus){ $("amount").focus(); }   // amount is kept, so she doesn't re-enter it
  }

  /* ---------- Events ---------- */
  $("amount").addEventListener("input", function(){ state.touched=true; validateInput(false); });
  $("amount").addEventListener("blur", function(){ if($("amount").value!=="" ) state.touched=true; validateInput(false); });
  $("amount").addEventListener("keydown", function(e){
    if(e.key==="Enter" && !$("seePlan").disabled){ $("seePlan").click(); }
  });
  $("seePlan").addEventListener("click", function(){
    validateInput(true);
    if(state.amountCents===null) return;
    renderS2(); show("s2");
  });
  $("back2").addEventListener("click", function(){ goS1(false); });
  $("scenario").addEventListener("change", function(e){
    $("amount").value=""; state.touched=false;
    loadScenario(e.target.value); renderS1(); show("s1");
  });

  /* ---------- Init ---------- */
  loadScenario("two");
  renderS1();
})();
</script>
</body>
</html>
